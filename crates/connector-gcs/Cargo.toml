[package]
name = "connector-gcs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "RecordSource connector for Google Cloud Storage, driven by GCS Pub/Sub object-finalize notifications"

[dependencies]
proof-core = { path = "../proof-core" }
proof-connectors = { path = "../proof-connectors" }
google-cloud-pubsub = "1.2.0"
google-cloud-storage = "1.16.0"
async-trait.workspace = true
serde.workspace = true
serde_json = "1"
bincode.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
which = "8.0.5"
