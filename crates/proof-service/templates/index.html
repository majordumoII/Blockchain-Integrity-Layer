<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blockchain Integrity Layer — Live Proof Feed</title>
  <script src="/static/htmx.min.js"></script>
  <script src="/static/sse.min.js"></script>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      max-width: 960px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.5;
    }
    header { margin-bottom: 1.5rem; }
    h1 { font-size: 1.25rem; margin-bottom: 0.25rem; }
    .subtitle { opacity: 0.7; font-size: 0.9rem; }
    #feed { display: flex; flex-direction: column-reverse; gap: 0.5rem; }
    .proof-row {
      border: 1px solid color-mix(in srgb, currentColor 20%, transparent);
      border-radius: 6px;
      padding: 0.6rem 0.8rem;
      font-size: 0.85rem;
    }
    .proof-row .meta { opacity: 0.65; }
    .proof-row .digest { word-break: break-all; }
    .badge {
      display: inline-block;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      font-size: 0.75rem;
      background: color-mix(in srgb, currentColor 12%, transparent);
      margin-right: 0.4rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Blockchain Integrity Layer</h1>
    <div class="subtitle">Live proof feed — every row below is a real cryptographic proof generated from a real observed change, not a mock.</div>
  </header>

  <div
    id="feed"
    hx-ext="sse"
    sse-connect="/feed"
    sse-swap="message"
    hx-swap="afterbegin"
  >
    {% for row in history %}
      {{ row|safe }}
    {% endfor %}
  </div>
</body>
</html>
