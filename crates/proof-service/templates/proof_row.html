<div class="proof-row">
  <span class="badge">{{ source_id }}</span>
  <span class="badge">{{ table }}</span>
  <span class="badge">{{ change_kind }}</span>
  <span class="meta">position {{ source_position }} · {{ attestation_count }} signature(s) · {{ timestamp }}</span>
  <div class="digest"><a href="/compliance/{{ digest_hex }}">{{ digest_hex }}</a></div>
</div>
