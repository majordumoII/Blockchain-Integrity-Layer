[package]
name = "connector-postgres"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "PostgreSQL logical replication (CDC) RecordSource for the Blockchain Integrity Layer"

[dependencies]
proof-connectors = { path = "../proof-connectors" }
postgres-protocol = "0.6"
fallible-iterator = "0.2"
tokio = { workspace = true, features = ["net", "io-util", "rt", "sync", "macros", "time"] }
bytes = "1"
async-trait.workspace = true
thiserror.workspace = true
serde.workspace = true
bincode.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
