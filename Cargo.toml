[workspace]
resolver = "3"
members = [
    "crates/proof-core",
    "crates/proof-connectors",
    "crates/connector-postgres",
    "crates/proof-service",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/charmingnyc/blockchain-integrity-layer"

[workspace.dependencies]
blake3 = "1.8"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }
p256 = { version = "0.13", features = ["serde", "ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
proptest = "1"
tokio = "1"
async-trait = "0.1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
